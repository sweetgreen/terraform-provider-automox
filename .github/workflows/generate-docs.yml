name: Docs

# Checks that docs/ matches the provider schemas. It regenerates and fails on a
# diff rather than committing the result: docs are generated from schema and
# example files that live in this repository, so a mismatch is an unfinished
# change, not something CI should quietly fix behind the author's back.
#
# Docs matter more here than usual. registry.sweetgreen.engineering serves what
# is in docs/, so stale documentation is what practitioners see.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'examples/**'
      - 'templates/**'
      - 'docs/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/generate-docs.yml'
  push:
    branches:
      - main

jobs:
  docs:
    name: '📚 Docs are current'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: 'go.mod'

      # tfplugindocs starts a real Terraform to read the provider schema, so a
      # CLI has to be present. It is pinned rather than floating: a Terraform
      # upgrade changing schema output would otherwise surface as an unrelated
      # docs diff on somebody else's pull request.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check example formatting
        run: terraform fmt -recursive -check examples/

      - name: Regenerate docs
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name automox

      - name: Fail if docs are stale
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ is out of date. Run 'make docs' and commit the result."
            git --no-pager diff --stat docs/
            git --no-pager diff docs/ | head -200
            exit 1
          fi
          echo "docs/ matches the provider schemas."
