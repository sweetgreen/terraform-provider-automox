# cloned from hashicorp and modifed to support ubuntu-latest-m , which provides more disk space
# for go build to complete successfully.
name: provider | Terraform Registry with goreleaser

permissions:
  contents: write
  packages: read
  statuses: write

on:
  workflow_call:
    inputs:
      goreleaser-release-args:
        description: 'goreleaser release Arguments (e.g. --skip-validate)'
        required: false
        type: string
      release-notes:
        description: 'Enable release notes handling (must have previously uploaded artifact named "release-notes" with file "release-notes.txt")'
        required: false
        type: boolean
      setup-go-version:
        description: 'setup-go Go Version'
        required: false
        type: string
      setup-go-version-file:
        description: 'setup-go File From Which To Read Go Version'
        required: false
        type: string
      git-ref:
        description: 'branch, tag or SHA to checkout'
        required: false
        type: string
      use-ssm-signing-keys:
        description: 'Fetch GPG signing keys from AWS SSM Parameter Store instead of GitHub Secrets. Requires the runner to have SSM read access.'
        required: false
        type: boolean
        default: false
    secrets:
      gpg-private-key:
        description: 'GPG Private Key (legacy: use use-ssm-signing-keys instead)'
        required: false
      gpg-private-key-passphrase:
        description: 'GPG Private Key Passphrase (legacy: use use-ssm-signing-keys instead)'
        required: false

jobs:
  Release:
    runs-on: ubuntu-xlarge # using sweetgreen self-hosted runner for more disk space
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.git-ref || github.ref }}
          fetch-depth: 0
      # tool-cache stays false. Deleting /opt/hostedtoolcache and then asking
      # setup-go to install a toolchain works against itself: the runner user
      # cannot recreate the directory, so the next step dies with
      # "EACCES: permission denied, mkdir '/opt/hostedtoolcache'".
      #
      # It only bites when the requested Go is not already cached on the runner,
      # which is why the other providers do not hit it -- they ask for 1.25.x and
      # this repository's go.mod floor is 1.26.6, raised for standard library
      # security fixes. Lowering the floor to match the runner would trade a
      # security fix for a green pipeline.
      #
      # The remaining cleanups still free the bulk of the space.
      - name: Free up Ubuntu runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false  # Preserve Docker for GoReleaser
          swap-storage: true
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ inputs.setup-go-version }}
          go-version-file: ${{ inputs.setup-go-version-file }}
          cache: false  # Disable caching to skip the post-cleanup step. saves circa 15 minutes

      # --- Path A: Fetch GPG signing keys from AWS SSM (runner instance credentials) ---
      - name: Fetch and import GPG signing key from SSM
        if: inputs.use-ssm-signing-keys
        id: ssm_gpg_import
        run: |
          GPG_PRIVATE_KEY=$(aws ssm get-parameter \
            --name "/terraform-registry-api-github-proxy/gpg-private-key" \
            --with-decryption --query "Parameter.Value" --output text)
          GPG_PASSPHRASE=$(aws ssm get-parameter \
            --name "/terraform-registry-api-github-proxy/gpg-private-key-passphrase" \
            --with-decryption --query "Parameter.Value" --output text)
          GPG_KEY_ID=$(aws ssm get-parameter \
            --name "/terraform-registry-api-github-proxy/gpg-key-id" \
            --query "Parameter.Value" --output text)

          # Mask sensitive values to prevent leaking in logs
          echo "::add-mask::${GPG_PRIVATE_KEY}"
          echo "::add-mask::${GPG_PASSPHRASE}"

          # The agent has to allow presetting before it will accept a passphrase
          # from gpg-connect-agent. Without this it rejects PRESET_PASSPHRASE,
          # and because nothing checks the result the failure only surfaces much
          # later, when goreleaser signs and gpg tries to prompt a terminal that
          # does not exist: "gpg: signing failed: Inappropriate ioctl for
          # device". Written before the agent starts, so no restart races.
          mkdir -p "${HOME}/.gnupg"
          chmod 700 "${HOME}/.gnupg"
          echo "allow-preset-passphrase" >> "${HOME}/.gnupg/gpg-agent.conf"
          echo "pinentry-mode loopback" >> "${HOME}/.gnupg/gpg.conf"
          gpgconf --kill gpg-agent || true
          gpg-connect-agent /bye

          # Import the GPG key
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          FINGERPRINT=$(gpg --list-keys --with-colons "${GPG_KEY_ID}" | awk -F: '/^fpr:/{print $10; exit}')

          # Preset passphrase in GPG agent for batch signing (required for goreleaser)
          KEYGRIP=$(gpg --batch --with-colons --with-keygrip --list-secret-keys "${GPG_KEY_ID}" | awk -F: '/^grp:/{print $10; exit}')
          HEX_PASSPHRASE=$(echo -n "${GPG_PASSPHRASE}" | xxd -p -c 256 | tr -d '\n' | tr 'a-f' 'A-F')
          if ! gpg-connect-agent "PRESET_PASSPHRASE ${KEYGRIP} -1 ${HEX_PASSPHRASE}" /bye | grep -q "^OK"; then
            echo "::error::gpg-agent refused the passphrase preset. Signing would fail later with 'Inappropriate ioctl for device'."
            exit 1
          fi

          # Prove signing works here rather than discovering it three minutes
          # into goreleaser, after every platform has been built.
          echo "signing probe" > "${RUNNER_TEMP}/sign-probe.txt"
          if ! gpg --batch --yes --local-user "${FINGERPRINT}" \
                 --output "${RUNNER_TEMP}/sign-probe.sig" \
                 --detach-sign "${RUNNER_TEMP}/sign-probe.txt"; then
            echo "::error::The signing key imported but cannot sign unattended. Check the passphrase parameter matches the key."
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/sign-probe.txt" "${RUNNER_TEMP}/sign-probe.sig"
          echo "Unattended signing verified."

          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "keyid=${GPG_KEY_ID}" >> "$GITHUB_OUTPUT"

          gpg --armor --export "${FINGERPRINT}" > gpg-public-key.asc
          echo "GPG Key ID: ${GPG_KEY_ID}"
          echo "GPG Fingerprint: ${FINGERPRINT}"
          echo "GPG public key exported to gpg-public-key.asc"
          echo "GPG signing keys derived from SSM parameters"

      # --- Path B: Legacy - Import GPG key from GitHub Secrets ---
      - name: Import GPG key from secrets
        if: ${{ !inputs.use-ssm-signing-keys }}
        id: import_gpg_legacy
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-private-key-passphrase }}

      - name: Export GPG public key for registry verification (legacy)
        if: ${{ !inputs.use-ssm-signing-keys }}
        run: |
          gpg --armor --export "${{ steps.import_gpg_legacy.outputs.fingerprint }}" > gpg-public-key.asc
          echo "GPG Key ID: ${{ steps.import_gpg_legacy.outputs.keyid }}"
          echo "GPG Fingerprint: ${{ steps.import_gpg_legacy.outputs.fingerprint }}"
          echo "GPG public key exported to gpg-public-key.asc"
          echo ""
          echo "To update the Terraform registry proxy SSM parameters, run:"
          echo "  aws ssm put-parameter --name /terraform-registry-api-github-proxy/gpg-key-id --value '${{ steps.import_gpg_legacy.outputs.keyid }}' --type String --overwrite"
          echo "  aws ssm put-parameter --name /terraform-registry-api-github-proxy/gpg-public-key --value \"\$(cat gpg-public-key.asc)\" --type SecureString --overwrite"

      # --- Resolve GPG fingerprint from whichever path was used ---
      - name: Set GPG fingerprint
        id: gpg_fingerprint
        run: |
          if [ "${{ inputs.use-ssm-signing-keys }}" = "true" ]; then
            echo "fingerprint=${{ steps.ssm_gpg_import.outputs.fingerprint }}" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint=${{ steps.import_gpg_legacy.outputs.fingerprint }}" >> "$GITHUB_OUTPUT"
          fi

      - if: inputs.release-notes != true
        name: goreleaser release (without release notes)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          args: release --clean ${{ inputs.goreleaser-release-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg_fingerprint.outputs.fingerprint }}
      - if: inputs.release-notes
        id: release-notes-download
        name: Release Notes Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: /tmp
      - if: inputs.release-notes
        name: goreleaser release (with release notes)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          args: release --release-notes ${{ steps.release-notes-download.outputs.download-path }}/release-notes.txt --clean ${{ inputs.goreleaser-release-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg_fingerprint.outputs.fingerprint }}
